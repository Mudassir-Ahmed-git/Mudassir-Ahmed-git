<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MUDASIR AHMED</title>
  <desc id="desc">Terminal glitch animation cycling through corrupted versions of MUDASIR AHMED.</desc>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="scanlines" width="1200" height="8" patternUnits="userSpaceOnUse">
      <rect width="1200" height="4" fill="#7dd3fc" opacity=".035"/>
    </pattern>

    <style>
      .name {
        font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
        font-size: 82px;
        font-weight: 700;
        letter-spacing: 4px;
      }

      .frame {
        animation: frameCycle 7.5s steps(1,end) infinite;
      }

      .f1 { animation: show1 7.5s steps(1,end) infinite; }
      .f2 { animation: show2 7.5s steps(1,end) infinite; }
      .f3 { animation: show3 7.5s steps(1,end) infinite; }
      .f4 { animation: show4 7.5s steps(1,end) infinite; }
      .f5 { animation: show5 7.5s steps(1,end) infinite; }

      @keyframes show1 {
        0%, 19% { opacity: 1; }
        20%, 100% { opacity: 0; }
      }
      @keyframes show2 {
        0%, 19% { opacity: 0; }
        20%, 39% { opacity: 1; }
        40%, 100% { opacity: 0; }
      }
      @keyframes show3 {
        0%, 39% { opacity: 0; }
        40%, 59% { opacity: 1; }
        60%, 100% { opacity: 0; }
      }
      @keyframes show4 {
        0%, 59% { opacity: 0; }
        60%, 79% { opacity: 1; }
        80%, 100% { opacity: 0; }
      }
      @keyframes show5 {
        0%, 79% { opacity: 0; }
        80%, 100% { opacity: 1; }
      }

      @keyframes scan {
        from { transform: translateY(-50px); }
        to { transform: translateY(410px); }
      }

      @keyframes cursor {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }

      .cursor {
        animation: cursor 1s steps(2,end) infinite;
      }

      .scan {
        animation: scan 5s linear infinite;
      }

      @keyframes glitch {
        0%, 90%, 100% { opacity: 0; transform: translate(0); }
        91% { opacity: .7; transform: translate(5px,-2px); }
        92% { opacity: .4; transform: translate(-5px,2px); }
        93% { opacity: .65; transform: translate(2px,0); }
        94% { opacity: 0; transform: translate(0); }
      }

      .glitch {
        animation: glitch 3.8s steps(1,end) infinite;
      }
    </style>
  </defs>

  <!-- Dark terminal -->
  <rect width="1200" height="360" rx="18" fill="#020617"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#1e3a52" stroke-width="2"/>

  <!-- Terminal header -->
  <circle cx="34" cy="28" r="6" fill="#334155"/>
  <circle cx="56" cy="28" r="6" fill="#334155"/>
  <circle cx="78" cy="28" r="6" fill="#334155"/>
  <text x="105" y="34" fill="#475569" font-family="monospace" font-size="14">~/mudasir</text>

  <!-- Prompt -->
  <text x="70" y="105" fill="#38bdf8" font-family="monospace" font-size="18" opacity=".7">$ whoami</text>

  <!-- Soft glow -->
  <text x="600" y="220" text-anchor="middle" class="name" fill="#38bdf8" opacity=".13" filter="url(#glow)">MUDASIR AHMED</text>

  <!-- 1: MUDA$IR AHMED -->
  <text x="600" y="220" text-anchor="middle" class="name f1" fill="#dff8ff" filter="url(#glow)">MUDA$IR AHMED</text>

  <!-- 2: MUDASIR AHM%D -->
  <text x="600" y="220" text-anchor="middle" class="name f2" fill="#dff8ff" filter="url(#glow)">MUDASIR AHM%D</text>

  <!-- 3: MUD$SIR AHMED -->
  <text x="600" y="220" text-anchor="middle" class="name f3" fill="#dff8ff" filter="url(#glow)">MUD$SIR AHMED</text>

  <!-- 4: MUDASIR AH%ED -->
  <text x="600" y="220" text-anchor="middle" class="name f4" fill="#dff8ff" filter="url(#glow)">MUDASIR AH%ED</text>

  <!-- 5: MUDASIR AHMED -->
  <text x="600" y="220" text-anchor="middle" class="name f5" fill="#dff8ff" filter="url(#glow)">MUDASIR AHMED</text>

  <!-- Occasional glitch ghost -->
  <g class="glitch" font-family="JetBrains Mono, Fira Code, Courier New, monospace"
     font-size="82" font-weight="700" letter-spacing="4px" text-anchor="middle">
    <text x="595" y="220" fill="#22d3ee">MUDASIR AHMED</text>
    <text x="605" y="220" fill="#60a5fa">MUDASIR AHMED</text>
  </g>

  <!-- Cursor -->
  <rect x="1050" y="153" width="7" height="78" rx="1" fill="#7dd3fc" class="cursor"/>

  <!-- Scanlines -->
  <rect width="1200" height="360" fill="url(#scanlines)"/>
  <rect class="scan" x="0" y="-50" width="1200" height="3" fill="#7dd3fc" opacity=".1"/>

  <!-- Footer -->
  <text x="70" y="310" fill="#334155" font-family="monospace" font-size="14">STATUS: ONLINE</text>
  <text x="1130" y="310" text-anchor="end" fill="#334155" font-family="monospace" font-size="14">PYTHON // BACKEND</text>
</svg>
